<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristina Libre · Domingos 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06122b;--panel:#0c1f4a;--panel2:#12296a;--line:#1f3a80;--field:#091a3d;--text:#f4f8ff;--muted:#bcd6f2;--gold:#ffd21f;--sky:#5bbcf0;--blue:#1f4fb4;--ink:#06122b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif}
body{overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical}
a{color:inherit}
.cond{font-family:'Barlow Condensed',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* logo */
.logoimg{display:block;height:64px;width:auto;max-width:220px;object-fit:contain}
.herologo{display:block;height:190px;width:auto;max-width:320px;object-fit:contain;margin:36px 0 0}
.herologo+h1{margin-top:14px}
/* menú */
header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.shield{width:46px;height:52px;background:var(--gold);color:var(--ink);clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;padding-bottom:6px}
.brand b{display:block;font-size:22px;letter-spacing:1px;line-height:1;font-weight:800}
.brand small{color:var(--muted);font-size:12px}
.links{display:flex;gap:4px;flex:1;overflow-x:auto;justify-content:center}
.links button{background:none;border:0;border-bottom:3px solid transparent;min-height:72px;padding:0 12px;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;color:var(--text)}
.links button[aria-current="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 10%,color-mix(in srgb,var(--sky) 45%,transparent),transparent 60%),radial-gradient(circle at 12% 0,color-mix(in srgb,var(--gold) 14%,transparent),transparent 40%),linear-gradient(var(--panel2),var(--bg));background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 92%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 55%,color-mix(in srgb,var(--bg) 20%,transparent) 100%);pointer-events:none}
.hero .big{position:absolute;right:26%;top:-30px;font-size:460px;line-height:1;font-weight:800;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.12);pointer-events:none;user-select:none}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:stretch;min-height:420px}
.hero h1{margin:70px 0 0;font-size:68px;line-height:.95;font-weight:800;text-transform:uppercase}
.hero h1 span{color:var(--gold);display:block}
.hero p{font-size:20px;letter-spacing:1px;margin:14px 0 18px}
.btn{min-height:44px;padding:0 22px;border:0;background:var(--gold);color:var(--ink);font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:3px}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:#ffb0b0;border:1px solid #6a2e2e}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.next{align-self:end;background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line);padding:16px 20px 20px;text-align:center}
.next h3{margin:0 0 14px;background:var(--panel2);padding:12px;font-size:20px;letter-spacing:1px;color:var(--gold)}
.vs{display:flex;align-items:center;justify-content:center;gap:14px}
.vs .t{width:110px;font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase;line-height:1.1}
.vs .v{font-size:30px;font-weight:800}
.info{text-align:left;margin:16px auto 14px;display:inline-grid;gap:8px;font-size:15px}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;color:#fff;flex:0 0 auto;border:2px solid rgba(255,255,255,.25)}

/* paneles */
main{padding:12px 0 40px}
.grid{display:grid;gap:12px;margin-top:12px}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g21 .gal{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);border-left:4px solid var(--gold)}
.ph h2{margin:0;font-size:22px;letter-spacing:.5px;font-weight:700;text-transform:uppercase}
.pb{padding:14px 18px 18px}
.link{background:none;border:0;color:var(--text);font-size:13px;font-weight:600;min-height:36px;padding:0 4px;text-transform:uppercase}
.link:hover{color:var(--gold)}
.meta{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tile{display:flex;align-items:flex-end;justify-content:flex-start;background:linear-gradient(135deg,var(--panel2),var(--blue));color:rgba(255,255,255,.9);font-weight:800;text-transform:uppercase;overflow:hidden;position:relative}
.tile::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.04) 22px 44px)}
.tile span{position:relative;padding:10px}

.newsgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.feat{background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.feat .tile{height:230px;font-size:54px;line-height:.9}
.feat h3{margin:8px 0 4px;font-size:26px;line-height:1.05;font-weight:800;text-transform:uppercase}
.feat p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.side{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;gap:12px;background:var(--field);border:0;padding:8px;text-align:left;width:100%}
.sitem .tile{width:84px;height:84px;flex:0 0 auto;font-size:30px}
.sitem h4{margin:2px 0;font-size:15px;line-height:1.2;text-transform:uppercase;font-weight:700}
.sitem p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.3}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;color:var(--muted);letter-spacing:1px;text-align:right;padding:6px 6px;font-weight:600}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:center;width:34px;font-weight:800}
td.p{font-weight:800;font-size:16px;color:var(--gold)}
.tn{display:flex;align-items:center;gap:8px;font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{min-height:40px;padding:0 16px;border:1px solid var(--line);background:var(--field);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.mrow{display:grid;grid-template-columns:70px minmax(0,1fr) 40px 90px 40px minmax(0,1fr) 64px;align-items:center;gap:8px;padding:10px 12px;background:var(--field);margin-bottom:6px}
.mrow .nm{font-weight:700;font-size:14px;text-transform:uppercase;line-height:1.15}
.mrow .nm.r{text-align:left}
.mrow .nm.l{text-align:right}
.mrow .sc{font-size:30px;font-weight:800;text-align:center;letter-spacing:2px}
.mrow .sc input{width:38px;padding:6px 2px;text-align:center;font-size:18px;display:inline-block}
.mrow .tm{color:var(--muted);font-size:13px}
.mrow .zn{color:var(--muted);font-size:12px;text-align:right}

.gl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.gl .n{width:22px;font-weight:800;text-align:center}
.gl .g{font-size:22px;font-weight:800;color:var(--gold);min-width:28px;text-align:right}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal img,.gal .ph0{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph0{background:linear-gradient(135deg,var(--panel2),var(--blue));display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:1px}
.sp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sp div{aspect-ratio:2/1;background:var(--field);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:1px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
footer{border-top:1px solid var(--line);background:var(--panel);padding:22px 0}
footer .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* detalle de noticia, sheets, chat */
.art{max-width:760px;margin:24px auto}
.art h1{font-size:46px;line-height:1;margin:10px 0;font-weight:800;text-transform:uppercase}
.art p{font-size:18px;line-height:1.6;margin:0 0 14px}
.tag{display:inline-block;padding:2px 10px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:1px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet>div{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;max-width:90%}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.team{display:flex;align-items:center;gap:12px;padding:12px;background:var(--field)}
.edit{display:flex;gap:6px;align-items:center}
.edit button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-weight:800}

@media (max-width:1000px){
  .hero .wrap{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:48px;margin-top:40px}
  .hero .big{right:-60px;font-size:320px}
  .next{align-self:auto;margin-bottom:16px}
  .g21,.newsgrid{grid-template-columns:minmax(0,1fr)}
  .g21 .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav .wrap{flex-wrap:wrap;gap:0 12px}
  .links{order:3;flex:1 0 100%;justify-content:flex-start}
  .links button{min-height:48px}
  .mrow{grid-template-columns:50px minmax(0,1fr) 34px 78px 34px minmax(0,1fr)}
  .mrow .zn{display:none}
}
@media (max-width:560px){
  .hero h1{font-size:40px}
  .brand small{display:none}
  .herologo{height:150px}
  .ph h2{font-size:19px}
  .links button{padding:0 10px;font-size:13px}
  .mrow{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);row-gap:4px;padding:10px}
  .mrow .badge{display:none}
  .mrow .tm{grid-column:1/-1;text-align:center}
  .mrow .nm{font-size:14px}
  .mrow .sc{font-size:26px}
  .toast{bottom:70px}
}
</style>
</head>

function rgbHex(r, g, b){ return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
function hex2hsl(h){
  h = h.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), L = (mx + mn) / 2; let H = 0, Sx = 0;
  if (mx !== mn) { const d = mx - mn; Sx = L > .5 ? d / (2 - mx - mn) : d / (mx + mn); H = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? ((b - r) / d + 2) : ((r - g) / d + 4); H *= 60; }
  return [H, Sx, L];
}

  r.setProperty('--bg', hsl(h, sat, .07)); r.setProperty('--ink', hsl(h, sat, .07));

  r.setProperty('--blue', t.blue); r.setProperty('--sky', t.sky); r.setProperty('--gold', t.gold);
  r.setProperty('--muted', hsl(sh, Math.min(ss, .7), .82));
}
function colorsFromLogo(url, cb){
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 48;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 48, 48);
    const d = x.getImageData(0, 0, 48, 48).data, B = { blue: [0, 0, 0, 0], sky: [0, 0, 0, 0], gold: [0, 0, 0, 0] };
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 200) continue;
      const [h, s, l] = hex2hsl(rgbHex(d[i], d[i + 1], d[i + 2]));
      if (s < .35 || l < .1 || l > .9) continue;
      let k = null;
      if (h >= 38 && h <= 68 && l > .4) k = 'gold'; else if (h >= 195 && h <= 250 && l < .45) k = 'blue'; else if (h >= 175 && h <= 215 && l >= .45) k = 'sky';
      if (k) { B[k][0] += d[i]; B[k][1] += d[i + 1]; B[k][2] += d[i + 2]; B[k][3]++; }
    }
    const out = {};
    for (const k in B) if (B[k][3] > 8) out[k] = rgbHex(B[k][0] / B[k][3], B[k][1] / B[k][3], B[k][2] / B[k][3]);
    cb(out);
  };
  img.src = url;
}

function readImage(file, max, cb, png){
  const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => {

  return '<div class="sheet" data-act="closesheet"><div><h2 class="cond" style="margin:0 0 4px;font-size:28px">AJUSTES</h2>' +
    '<label style="display:flex;align-items:center;gap:10px;color:var(--text);font-size:16px"><input type="checkbox" id="ed" style="width:22px;height:22px" ' + (s.editor ? 'checked' : '') + '> Modo editor (cargar resultados, noticias, fotos)</label>' +
    '<label for="ve">Cancha / sede</label><input id="ve" value="' + esc(s.venue) + '" placeholder="Nombre de la cancha"><label for="ci">Ciudad</label><input id="ci" value="' + esc(s.city) + '">' +
    '<label>Logo del torneo (CFK Libre)</label><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn ghost sm" style="display:inline-flex;align-items:center;margin:0;cursor:pointer;color:var(--text)">Subir logo<input type="file" accept="image/*" data-act="upload" data-kind="logo" style="display:none"></label>' + (S.logo ? '<button class="btn ghost sm" data-act="logocolors">Tomar colores del logo</button><button class="btn danger sm" data-act="dellogo">Quitar</button>' : '') + '</div>' +
    '<label>Colores</label><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="color" id="cb" value="' + s.theme.blue + '" style="width:44px;height:44px;padding:2px"> Azul</label><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="color" id="cs" value="' + s.theme.sky + '" style="width:44px;height:44px;padding:2px"> Celeste</label><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="color" id="cg" value="' + s.theme.gold + '" style="width:44px;height:44px;padding:2px"> Amarillo</label></div>' +
    '<label>Foto de portada (opcional)</label><div style="display:flex;gap:8px"><label class="btn ghost sm" style="display:inline-flex;align-items:center;margin:0;cursor:pointer;color:var(--text)">Elegir foto<input type="file" accept="image/*" data-act="upload" data-kind="hero" style="display:none"></label>' + (S.hero ? '<button class="btn danger sm" data-act="delhero">Quitar</button>' : '') + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" data-act="savesettings">Guardar</button><button class="btn ghost" data-act="closesheet">Cerrar</button><button class="btn danger" data-act="reset">Restaurar datos de muestra</button></div></div></div>';
}
function sheetNews(){
  const d = ui.draft;
  return '<div class="sheet" data-act="closesheet"><div><h2 class="cond" style="margin:0 0 4px;font-size:28px">NUEVA NOTICIA</h2><label for="nt">Etiqueta</label><select id="nt">' + ['Noticia', 'Destacada', 'Fixture', 'Sanciones', 'Posiciones', 'Torneo'].map(t => '<option' + (d.tag === t ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
    '<label for="ntt">Título</label><input id="ntt" value="' + esc(d.title) + '"><label for="nb">Texto</label><textarea id="nb" rows="8">' + esc(d.body) + '</textarea>' +
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-act="publish">Publicar</button><button class="btn ghost" data-act="closesheet">Cancelar</button></div></div></div>';
}
function render(){
  applyTheme();
  const v = { home: homeView, news: viewNews, fixture: viewFixture, tables: viewTables, teams: viewTeams, gallery: viewGallery, contact: viewContact }[ui.tab]();
  document.getElementById('root').innerHTML = navbar() + v + footer() +
    (ui.sheet === 'settings' ? sheetSettings() : ui.sheet === 'news' ? sheetNews() : '') +
    (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + '</div>' : '');
}
function toast(t){ ui.toast = t; render(); setTimeout(() => { ui.toast = ''; render(); }, 2600); }

/* ===== Eventos ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  if (el.classList.contains('sheet') && e.target !== el) return;
  const a = el.dataset.act;
  if (a === 'tab') { ui.tab = el.dataset.tab; ui.newsId = null; render(); window.scrollTo(0, 0); }
  else if (a === 'news') { ui.tab = 'news'; ui.newsId = el.dataset.id; render(); window.scrollTo(0, 0); }
  else if (a === 'fecha') { ui.fecha = +el.dataset.n; render(); }
  else if (a === 'zone') { ui.zone = el.dataset.z; render(); }
  else if (a === 'settings') { ui.sheet = 'settings'; render(); }
  else if (a === 'closesheet') { ui.sheet = null; render(); }
  else if (a === 'savesettings') {
    const s = S.settings; s.editor = document.getElementById('ed').checked; s.venue = document.getElementById('ve').value.trim(); s.city = document.getElementById('ci').value.trim();
    s.theme = { blue: document.getElementById('cb').value, sky: document.getElementById('cs').value, gold: document.getElementById('cg').value };
    save(); ui.sheet = null; render(); toast('Ajustes guardados');
  }
  else if (a === 'reset') { const keep = { logo: S.logo, theme: S.settings.theme }; S = buildSeed(); S.logo = keep.logo; S.settings.theme = keep.theme; save(); ui.sheet = null; ui.fecha = null; render(); toast('Datos de muestra restaurados'); }
  else if (a === 'dellogo') { S.logo = ''; save(); render(); }
  else if (a === 'logocolors') { colorsFromLogo(S.logo, c => { if (!Object.keys(c).length) { toast('No pude detectar colores en el logo'); return; } Object.assign(S.settings.theme, c); save(); render(); toast('Colores tomados del logo'); }); }
  else if (a === 'delhero') { S.hero = ''; save(); render(); }
  else if (a === 'newnews') { ui.draft = { tag: 'Noticia', title: '', body: '' }; ui.sheet = 'news'; render(); }
  else if (a === 'publish') {
    const t = document.getElementById('ntt').value.trim(), b = document.getElementById('nb').value.trim();
    if (!t || !b) { toast('Falta el título o el texto'); return; }
    S.news.unshift({ id: 'n' + Date.now(), tag: document.getElementById('nt').value, title: t, body: b, ts: Date.now() });
    save(); ui.sheet = null; ui.tab = 'home'; render(); toast('Noticia publicada');
  }
  else if (a === 'delnews') { S.news = S.news.filter(n => n.id !== el.dataset.id); save(); ui.newsId = null; render(); toast('Noticia borrada'); }
  else if (a === 'delphoto') { S.gallery.splice(+el.dataset.i, 1); save(); render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'score') {
    for (const f of S.fechas) for (const g of f.games) if (g.id === el.dataset.id) g[el.dataset.s] = el.value === '' ? null : Math.max(0, parseInt(el.value, 10) || 0);
    save(); render();
  } else if (el.dataset.act === 'upload' && el.files && el.files.length) {
    const kind = el.dataset.kind, files = Array.from(el.files);
    if (kind === 'logo') { readImage(files[0], 420, url => { S.logo = url; colorsFromLogo(url, c => { Object.assign(S.settings.theme, c); const ok = save(); render(); toast(!ok ? 'No hay lugar para guardar el logo' : Object.keys(c).length ? 'Logo cargado y colores tomados del logo' : 'Logo cargado'); }); }, true); return; }
    let pending = files.length, failed = false;
    files.forEach(f => readImage(f, kind === 'hero' ? 1600 : 700, url => {
      if (kind === 'hero') S.hero = url; else S.gallery.push(url);
      if (--pending === 0) { if (!save()) { failed = true; if (kind === 'hero') S.hero = ''; else S.gallery.length = Math.max(0, S.gallery.length - files.length); } render(); toast(failed ? 'No hay más lugar para fotos en este navegador' : 'Foto cargada'); }
    }));
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
});
render();
</script>
</body>
</html>
