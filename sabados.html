<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristina Libre · Fixture y Posiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;900&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase (modo en vivo, opcional). Si no hay internet o no está configurado, la app sigue funcionando local. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#eaf4fc;
    --bg-card:#ffffff;
    --bg-card-2:#f8fafc;
    --bg-card-3:#f1f5f9;
    --chalk:#0a2a55;
    --chalk-dim:#3d5a80;
    --chalk-faint:#94a3b8;
    --volt:#2b8fd0;
    --volt-dim:#1f78b4;
    --blue:#00489c;
    --blue-dim:#00336f;
    --coral:#dc2626;
    --zone-a:#2b8fd0;
    --zone-b:#00489c;
    --gold:#c48f00;
    --gold-dim:#9c7100;
    --line:rgba(10,42,85,.1);
    --line-strong:rgba(10,42,85,.18);
    --ink:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .stripes{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(10,42,85,.04) 1px,transparent 1px);
    background-size:18px 18px;
  }
  .stripes::before{
    content:"";position:fixed;top:0;left:0;right:0;height:260px;
    background:radial-gradient(ellipse at 30% top,rgba(0,72,156,.06),transparent 70%);
  }
  .app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}

  /* ─── Tab rail ─── */
  .railwrap{
    position:sticky;top:0;z-index:10;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
    display:flex;flex-direction:row;
    border-bottom:2px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    box-shadow:0 2px 8px rgba(10,42,85,.06);
  }
  .railwrap::-webkit-scrollbar{display:none;}
  .tab{
    writing-mode:horizontal-tb;transform:none;
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--chalk-faint);
    background:none;border:none;cursor:pointer;
    padding:12px 16px;white-space:nowrap;flex:0 0 auto;
    border-bottom:3px solid transparent;
    transition:color .15s ease,border-color .15s ease;
  }
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover:not(.active){color:var(--chalk);}
  .tab .arrow{display:none;}

  main{flex:1;padding:0 16px 60px;max-width:900px;width:100%;}

  /* ─── Banner ─── */
  header.top{border-bottom:1px solid var(--line);margin-bottom:20px;}
  .banner-img{width:100%;height:auto;display:block;border-radius:0 0 8px 8px;}
  .banner-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;letter-spacing:.03em;text-transform:uppercase;color:var(--blue);padding:18px 4px 6px;line-height:1;}
  .sub-bar{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;padding:10px 0 14px;
  }
  header.top .sub{font-size:12px;color:var(--chalk-dim);letter-spacing:.04em;}

  /* ─── Headstats ─── */
  .headstats{display:flex;gap:20px;font-family:'IBM Plex Mono',monospace;}
  .headstats div{text-align:right;}
  .headstats .n{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:22px;color:var(--blue);display:block;line-height:1;
  }
  .headstats .l{font-size:9px;color:var(--chalk-faint);letter-spacing:.08em;text-transform:uppercase;}

  /* ─── Section titles ─── */
  h2.sectiontitle{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--chalk);
    margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  h2.sectiontitle::before{content:"";width:4px;height:18px;background:var(--blue);flex:0 0 auto;border-radius:2px;}
  h2.sectiontitle .tag{
    font-size:10px;font-family:'IBM Plex Mono',monospace;
    background:rgba(0,72,156,.08);color:var(--blue);
    padding:3px 8px;letter-spacing:0;font-weight:500;text-transform:none;border-radius:4px;
  }

  /* ─── Zone picker ─── */
  .zonepicker{display:flex;gap:0;margin-bottom:18px;}
  .zonebtn{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 20px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--bg-card);
    color:var(--chalk-faint);transition:all .15s ease;
  }
  .zonebtn.zoneA.active{background:var(--zone-a);color:#fff;border-color:var(--zone-a);}
  .zonebtn.zoneB.active{background:var(--zone-b);color:#fff;border-color:var(--zone-b);}
  .zonebtn:hover:not(.active){border-color:var(--chalk-dim);color:var(--chalk);}

  /* ─── Match cards ─── */
  .match-card{
    background:var(--bg-card);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px 10px;margin-bottom:10px;
    box-shadow:0 1px 4px rgba(10,42,85,.06);
  }
  .match-card.played{border-color:rgba(79,174,232,.25);background:#e8f4fd;}
  .match-card.special{opacity:.65;}
  .match-card.admin-match{border-color:rgba(251,192,2,.3);background:#fffbea;}

  .match-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px;}
  .teamname{color:var(--chalk);font-size:14px;font-weight:600;line-height:1.2;}
  .teamname.left{text-align:left;}
  .teamname:not(.left){text-align:right;}
  .teamname.ret{color:var(--chalk-faint);text-decoration:line-through;}

  .score-block{display:flex;align-items:center;gap:6px;justify-content:center;}
  .scorebox{
    width:46px;text-align:center;
    background:#f1f5f9;border:1.5px solid #cbd5e1;
    color:var(--blue);
    font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;
    border-radius:6px;padding:3px 0;line-height:1;
  }
  .scorebox:disabled{opacity:.35;background:#f8fafc;color:var(--chalk-faint);}
  .scorebox:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,72,156,.15);}
  .dash{color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;font-size:16px;}

  .score-display{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;
    font-size:32px;color:var(--blue);line-height:1;min-width:28px;text-align:center;
  }
  .score-display.anulado{font-size:12px;color:var(--chalk-faint);font-weight:600;}
  .score-display.wo{font-size:14px;color:var(--coral);font-weight:700;}
  .score-vs{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--chalk-faint);}

  .match-when-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .match-date{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;
    color:var(--ink);background:var(--chalk);padding:3px 12px;border-radius:4px;
  }
  .match-time{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;
    color:var(--volt);letter-spacing:.04em;
    background:rgba(79,174,232,.1);border:1px solid rgba(79,174,232,.3);
    padding:2px 12px;border-radius:4px;
  }
  .match-edit-when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sched-date{
    background:#f8fafc;border:1.5px solid #cbd5e1;color:var(--chalk);
    border-radius:6px;padding:7px 10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;width:160px;
  }
  .sched-time{
    background:#f8fafc;border:1.5px solid #cbd5e1;color:var(--blue);
    border-radius:6px;padding:7px 10px;
    font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
    width:90px;letter-spacing:.04em;
  }
  .sched-date:focus,.sched-time:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,72,156,.1);}

  .match-status-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;}
  .status{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;}
  .status.pend{color:var(--chalk-faint);}
  .status.ok{color:var(--volt);}
  .status.wo{color:var(--coral);}
  .status.admin{color:var(--gold);}

  .admin-badge{
    font-size:12px;color:#7a5800;
    background:#fff6d6;border:1px solid #fde08a;
    border-radius:5px;padding:6px 10px;margin-bottom:6px;
  }

  /* ─── Jornada ─── */
  .jornada{margin-bottom:24px;}
  .jornada-head{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    border-bottom:2px solid rgba(0,72,156,.15);padding-bottom:7px;margin-bottom:10px;
  }
  .jornada-head h3{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;
    font-size:16px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin:0;
  }
  .jornada-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .jornada-controls input[type=date],.jornada-controls input[type=time]{
    background:#f8fafc;border:1.5px solid #cbd5e1;color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;font-size:11px;border-radius:5px;padding:5px 6px;
  }
  button.action.small{padding:6px 10px;font-size:10px;}

  /* ─── BYE banner ─── */
  .bye-banner{
    display:flex;align-items:center;gap:8px;
    background:rgba(0,72,156,.06);border:1px solid rgba(0,72,156,.2);
    border-radius:6px;padding:8px 14px;margin-bottom:10px;
  }
  .bye-icon{font-size:14px;}
  .bye-text{font-size:12px;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;}
  .bye-team{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;}

  /* ─── Standings ─── */
  table.standings{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;}
  table.standings th{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-faint);
    text-align:center;padding:8px 6px;border-bottom:2px solid var(--line-strong);
  }
  table.standings th:first-child,table.standings td:first-child{text-align:left;}
  table.standings td{
    font-family:'IBM Plex Mono',monospace;text-align:center;
    padding:9px 6px;border-bottom:1px solid var(--line);color:var(--chalk);
  }
  table.standings td.teamcell{font-family:'Inter',sans-serif;text-align:left;font-size:13px;}
  table.standings td.pts{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--blue);}
  table.standings tr.qual td{background:rgba(79,174,232,.06);}
  table.standings tr.qual td.teamcell{border-left:3px solid var(--volt);padding-left:8px;}
  table.standings tr.champion td.teamcell{color:var(--gold);font-weight:700;}
  table.standings .pos{color:var(--chalk-faint);width:22px;}
  .retbadge{font-size:9px;color:var(--coral);border:1px solid var(--coral);border-radius:3px;padding:1px 4px;margin-left:6px;}

  /* ─── Cards ─── */
  .card{
    background:var(--bg-card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 16px;margin-bottom:20px;
    box-shadow:0 1px 6px rgba(10,42,85,.06);
  }

  /* ─── Teams ─── */
  .teamlist{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
  @media(max-width:600px){.teamlist{grid-template-columns:1fr;}}
  .teamitem{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .teamitem .nm{display:flex;align-items:center;gap:8px;}
  .zonedot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .zonedot.A{background:var(--zone-a);}
  .zonedot.B{background:var(--zone-b);}
  .switch{position:relative;width:38px;height:20px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:#e2e8f0;border:1.5px solid #cbd5e1;border-radius:20px;transition:.15s;
  }
  .slider::before{
    content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;
    background:var(--chalk-faint);border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider{background:var(--coral);border-color:var(--coral);}
  .switch input:checked + .slider::before{transform:translateX(17px);background:#fff;}

  /* ─── Buttons ─── */
  button.action{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--blue);color:#fff;
    border:none;padding:10px 20px;cursor:pointer;transition:filter .15s ease;border-radius:6px;
  }
  button.action:hover{filter:brightness(1.1);}
  button.action.ghost{
    background:transparent;color:var(--chalk-dim);
    border:1.5px solid var(--line-strong);border-radius:6px;
  }
  button.action.ghost:hover{color:var(--chalk);border-color:var(--chalk-dim);}
  button.action.danger{background:var(--coral);color:#fff;}

  /* ─── Reglas ─── */
  .reglas{columns:2;column-gap:28px;font-size:13px;line-height:1.6;color:var(--chalk-dim);}
  @media(max-width:600px){.reglas{columns:1;}}
  .reglas h4{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 4px;}
  .reglas p{margin:0 0 14px;}

  .empty{text-align:center;padding:50px 20px;color:var(--chalk-dim);}
  .empty p{max-width:400px;margin:10px auto 22px;font-size:14px;}

  footer.note{font-size:11px;color:var(--chalk-faint);margin-top:28px;border-top:1px solid var(--line);padding-top:14px;line-height:1.6;}

  /* ─── Lockbadge ─── */
  .lockbadge{
    display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--coral);border:1px solid var(--coral);border-radius:4px;padding:2px 6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .lockbadge.live{color:var(--volt);border-color:var(--volt);}

  /* ─── Image modal ─── */
  .imgmodal{position:fixed;inset:0;background:rgba(10,42,85,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
  .imgmodal-card{
    background:var(--bg-card);border:1px solid var(--line-strong);border-radius:12px;
    padding:16px;max-width:480px;width:100%;max-height:90vh;overflow:auto;
    display:flex;flex-direction:column;gap:14px;align-items:center;
    box-shadow:0 20px 60px rgba(10,42,85,.2);
  }
  .imgmodal-card img{width:100%;border-radius:6px;border:1px solid var(--line);}
  .imgmodal-actions{display:flex;gap:10px;width:100%;}
  .imgmodal-actions button{flex:1;}
  .imgmodal-hint{font-size:11px;color:var(--chalk-faint);text-align:center;margin:0;}

  /* ─── Format switcher ─── */
  .formatswitch{display:flex;gap:6px;margin-bottom:16px;}
  .fmtbtn{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;
    border:1.5px solid var(--line-strong);background:transparent;
    color:var(--chalk-dim);cursor:pointer;transition:all .15s ease;border-radius:6px;
  }
  .fmtbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .fmtbtn:hover:not(.active){border-color:var(--chalk-dim);color:var(--chalk);}

  /* ─── Feeder ─── */
  .feeder{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .feeder-col{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;flex:1;min-width:180px;}
  .feeder-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
  .feeder-label.za{color:var(--zone-a);}
  .feeder-label.zb{color:var(--zone-b);}
  .feeder-seed{font-size:13px;padding:4px 0;display:flex;gap:8px;color:var(--chalk);}
  .feeder-pos{color:var(--chalk-faint);font-family:'IBM Plex Mono',monospace;width:20px;flex:0 0 auto;}
  .feeder-arrow{font-size:24px;color:var(--blue);flex:0 0 auto;}
  .feeder-center{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;
    text-align:center;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;
    background:rgba(0,72,156,.06);border:1px solid rgba(0,72,156,.2);
    padding:14px 10px;flex:0 0 120px;border-radius:6px;
  }
  .feeder-center span{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--chalk-faint);text-transform:none;}

  /* ─── Bracket ─── */
  .bracket{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 20px;}
  .bracket-col{display:flex;flex-direction:column;min-width:180px;flex:0 0 auto;position:relative;}
  .bracket-col + .bracket-col{margin-left:24px;}
  .bracket-col-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);text-align:center;margin-bottom:10px;}
  .bracket-third-title{margin-top:28px;}
  .bracket-col.r1{justify-content:space-between;gap:16px;}
  .bracket-col.sf{justify-content:space-around;}
  .bracket-col.fcol{justify-content:center;}
  .bm{background:var(--bg-card);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;position:relative;margin-bottom:12px;box-shadow:0 1px 4px rgba(10,42,85,.06);}
  .bracket-col.fcol .bm{margin-bottom:0;}
  .bm.decided{border-color:rgba(0,72,156,.4);}
  .bm-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;}
  .bm-row.win .bm-team{color:var(--blue);font-weight:700;}
  .bm-team{color:var(--chalk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bm-score{
    width:32px;text-align:center;background:#f1f5f9;border:1.5px solid #cbd5e1;
    color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
    border-radius:4px;padding:2px 0;flex:0 0 auto;
  }
  .bm-score:disabled{opacity:.35;}
  .bm-score:focus{outline:none;border-color:var(--blue);}
  .bm-penal{width:100%;margin-top:6px;background:#f8fafc;border:1px solid #cbd5e1;color:var(--chalk-dim);font-size:11px;border-radius:4px;padding:4px;}
  .bm-penalnote{font-size:10px;color:var(--coral);margin-top:4px;}

  /* ─── Champion ─── */
  .championbanner{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;
    font-size:20px;color:var(--gold);text-align:center;
    border:2px solid rgba(251,192,2,.3);border-radius:10px;
    padding:14px;margin-bottom:16px;letter-spacing:.04em;text-transform:uppercase;
    background:rgba(251,192,2,.06);
  }

  /* ─── Login overlay ─── */
  .login-overlay{position:fixed;inset:0;background:rgba(10,42,85,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{
    background:var(--bg-card);border:1px solid var(--line-strong);border-radius:12px;
    padding:28px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;
    box-shadow:0 20px 60px rgba(10,42,85,.2);
  }
  .login-box input{
    background:#f8fafc;border:1.5px solid #cbd5e1;color:var(--chalk);
    padding:14px;border-radius:6px;font-size:16px;font-family:'Inter',sans-serif;
    -webkit-appearance:none;width:100%;
  }
  .login-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,72,156,.1);}
  .loginform{display:flex;flex-direction:column;gap:10px;max-width:320px;}
  .loginform input{
    background:#f8fafc;border:1.5px solid #cbd5e1;color:var(--chalk);

// Zona única de 10 equipos. El orden está armado para que la Fecha 1 salga así:
// Los Santia vs El Tala · Maleficos vs Tapones Flojos · Los Verdes vs Tala Solano
// Los Azules vs Chanca · Perro Malo vs Arco Iris
const TEAM_NAMES = [
  "Los Santia","Maleficos","Los Verdes","Los Azules","Perro Malo",
  "Arco Iris","Chanca","Tala Solano","Tapones Flojos","El Tala"
];
// Horarios precargados de la Fecha 1 (local|visitante)
const FECHA1_HORARIOS = {
  "Los Santia|El Tala":"14:00", "Maleficos|Tapones Flojos":"15:00", "Los Verdes|Tala Solano":"16:00",
  "Los Azules|Chanca":"17:00", "Perro Malo|Arco Iris":"18:00"
};
// Cambios de nombre: se aplican sobre los datos ya guardados sin borrar resultados
const TEAM_RENAMES = {};
function applyRenames(s){
  if(s && s.teams) s.teams.forEach(t=>{ if(TEAM_RENAMES[t.name]) t.name = TEAM_RENAMES[t.name]; });
  return s;
}
const IDA_Y_VUELTA = false;            // true = se agrega la segunda rueda (18 fechas)
const FECHA1_DIA = "2026-11-14";       // Fecha 1: sábado 14 de noviembre
const STORAGE_KEY = "torneoSabados2_v1";
const FIRESTORE_DOC = "sabados2";       // documento propio en Firestore (el torneo original usa "mas50")
const TEAMS_FINGERPRINT = TEAM_NAMES.join('|');
const FIXTURE_VERSION = 1;
// Se juega los sábados: cada fecha arranca con el sábado siguiente a la anterior (editable)
function sabadoDeFecha(n){
  const [y,m,d] = FECHA1_DIA.split('-').map(Number);
  const dt = new Date(y, m-1, d + (n-1)*7);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function esSabado(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).getDay() === 6; }

const FIXED_TIMES = [];

// Horarios permitidos: de HORA_INICIO a HORA_FIN, cada INTERVALO_MIN minutos.
// Un mismo horario no se puede repetir dentro de la misma fecha.
const HORA_INICIO = '13:00';
const HORA_FIN = '18:00';
const INTERVALO_MIN = 60;
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function fromMin(n){ return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }
const PRESET_TIMES = (()=>{ const out=[]; for(let t=toMin(HORA_INICIO); t<=toMin(HORA_FIN); t+=INTERVALO_MIN) out.push(fromMin(t)); return out; })();
function timeInRange(t){ return !!t && toMin(t) >= toMin(HORA_INICIO) && toMin(t) <= toMin(HORA_FIN); }

function usedTimesInJornada(jornada, excludeMatchId){
  const used = new Set();
  [...state.matches, ...(state.finalMatches||[])].forEach(m=>{
    if(m.id !== excludeMatchId && m.jornada === jornada && m.time) used.add(m.time);
  });
  return used;
}

function handleTimePick(sel){
  const t = sel.value;
  if(!t) return;
  const mid = sel.dataset.matchId;
  const zone = sel.dataset.zone;
  const jornada = sel.dataset.jornada;
  if(mid) setMatchSchedule(parseInt(mid), 'time', t);
  else if(zone && jornada) setJornadaTime(zone, parseInt(jornada), t);
}

function timePickerHtml(currentTime, onchangeExpr, jornada, matchId){
  const used = (jornada != null && matchId != null) ? usedTimesInJornada(jornada, matchId) : new Set();
  // Parse zone/jornada from onchangeExpr for data attributes
  let dataAttrs = '';
  if(matchId != null){
    dataAttrs = `data-match-id="${matchId}"`;
  } else if(onchangeExpr && onchangeExpr.includes('setJornadaTime')){
    // Extract zone and jornada from expression like setJornadaTime('A', 1, '__TIME__')
    const m = onchangeExpr.match(/setJornadaTime\('([^']+)',\s*(\d+)/);
    if(m) dataAttrs = `data-zone="${m[1]}" data-jornada="${m[2]}"`;
  }
  const list = (currentTime && !PRESET_TIMES.includes(currentTime)) ? [...PRESET_TIMES, currentTime].sort() : PRESET_TIMES;
  const options = list.map(t=>{
    const taken = used.has(t) && t !== currentTime;
    return `<option value="${t}" ${currentTime===t?'selected':''} ${taken?'disabled':''}>${t}hs${taken?' ✗':''}</option>`;
  }).join('');
  return `<select class="time-select" onchange="handleTimePick(this)" ${dataAttrs}>
    <option value="">-- Horario --</option>
    ${options}
  </select>`;
}
const FIXED_SCHEDULE = [];

function applyFixedTimes(matches){
  matches.forEach(m=>{
    if(m.wo || m.anulado) return;
    const home = getTeam(m.home), away = getTeam(m.away);
    // Reglas globales (siempre)
    FIXED_TIMES.forEach(rule=>{
      if(home.name === rule.teamName || away.name === rule.teamName){
        m.time = rule.time;
      }
    });
    // Reglas por fecha específica
    FIXED_SCHEDULE.forEach(rule=>{
      if(m.jornada === rule.jornada && (home.name === rule.teamName || away.name === rule.teamName)){
        m.time = rule.time;
      }
    });
  });
}
let VIEW_ONLY = false;
let EMBEDDED_STATE = null;

/* seeded RNG so the demo is reproducible on fresh init */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateRoundRobin(ids){
  let arr = ids.slice();
  const n = arr.length;
  const numRounds = n - 1;
  const half = n / 2;
  const rounds = [];
  for(let r=0; r<numRounds; r++){
    const pairs = [];
    for(let i=0; i<half; i++){
      const a = arr[i], b = arr[n-1-i];
      pairs.push(r % 2 === 0 ? [a,b] : [b,a]);
    }
    rounds.push(pairs);
    const last = arr.pop();
    arr.splice(1,0,last);
  }
  return rounds;
}

function freshState(){
  const teams = TEAM_NAMES.map((name,i)=>({ id:i+1, name, zone:'A', retirado:false }));
  let matchId = 1;
  const matches = [];
  let rounds = generateRoundRobin(teams.map(t=>t.id));
  if(IDA_Y_VUELTA){
    rounds = rounds.concat(rounds.map(pairs=>pairs.map(([h,a])=>[a,h])));
  }
  rounds.forEach((pairs,idx)=>{
    pairs.forEach(([home,away])=>{
      matches.push({id:matchId++,zone:'A',jornada:idx+1,home,away,
        scoreHome:null,scoreAway:null,jugado:false,wo:false,woFor:null,anulado:false,
        adminResult:null,date: sabadoDeFecha(idx+1), time: idx===0 ? (FECHA1_HORARIOS[TEAM_NAMES[home-1]+'|'+TEAM_NAMES[away-1]] || null) : null});
    });
  });
  return { teams, matches, finalMatches:[], finalGenerated:false, finalTeams:[],
    finalFormat:'hexagonal', bracket:null, fixtureVersion:FIXTURE_VERSION, sanciones:[] };
}

function simulateScore(rng){
  const roll = rng();
  if(roll < 0.55) return Math.floor(rng()*3); // 0-2 most common
  if(roll < 0.85) return 3;
  return 4;
}

function pad2(n){ return String(n).padStart(2,'0'); }
function toIso(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function assignDemoSchedule(state){
  // Zone phase: one matchday per week, both zones play the same weekend.
  const zoneBase = new Date(2026,2,7); // base Saturday for jornada 1
  ['A','B'].forEach(zone=>{
    for(let j=1; j<=Math.max(...state.matches.map(m=>m.jornada)); j++){
      const d = new Date(zoneBase); d.setDate(d.getDate() + (j-1)*7);
      const iso = toIso(d);
      state.matches.filter(m=>m.zone===zone && m.jornada===j).forEach(m=>{ m.date = iso; m.time = '09:00'; });
    }
  });
  // Final phase: weekly, starting the week after the zone phase ends.
  if(state.finalMatches && state.finalMatches.length){
    const finalBase = new Date(zoneBase); finalBase.setDate(finalBase.getDate() + 11*7);
    const maxJornada = Math.max(...state.finalMatches.map(m=>m.jornada));
    for(let j=1; j<=maxJornada; j++){
      const d = new Date(finalBase); d.setDate(d.getDate() + (j-1)*7);
      const iso = toIso(d);
      state.finalMatches.filter(m=>m.jornada===j).forEach(m=>{ m.date = iso; m.time = '10:00'; });
    }
  }
  // Aplicar horarios fijos (ej: Charly siempre a las 08:00)
  applyFixedTimes([...state.matches, ...(state.finalMatches||[])]);
}

function seedDemoData(state){
  const rng = mulberry32(20260621);
  state.matches.forEach(m=>{
    m.scoreHome = simulateScore(rng); m.scoreAway = simulateScore(rng); m.jugado = true;
  });
  saveState(state);
  generateFasePhase(state, rng, true);
  assignDemoSchedule(state);
  saveState(state);
  return state;
}

function getTeam(id){ return state.teams.find(t=>t.id===id); }

function computeStandings(matchList, teamIds){
  const map = {};
  teamIds.forEach(id=>{ map[id] = { teamId:id, pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0 }; });
  matchList.forEach(m=>{
    if(m.anulado) return;
    if(!teamIds.includes(m.home) || !teamIds.includes(m.away)) return;
    if(m.wo){
      const winner = m.woFor, loser = (m.home===winner)? m.away : m.home;
      if(map[winner]){ map[winner].pj++; map[winner].g++; map[winner].pts+=2; }
      if(map[loser]){ map[loser].pj++; map[loser].p++; }
      return;
    }
    // Resultado administrativo: se asignan los puntos independientemente del marcador
    if(m.adminResult){
      const winner = m.adminResult.teamId, loser = (m.home===winner)? m.away : m.home;
      if(map[winner]){ map[winner].pj++; map[winner].g++; map[winner].pts+=2; }
      if(map[loser]){ map[loser].pj++; map[loser].p++; }
      // Goles del marcador real (si los hay) NO cuentan en estadísticas
      return;
    }
    if(m.jugado && m.scoreHome!==null && m.scoreAway!==null){
      const H=map[m.home], A=map[m.away];
      if(!H||!A) return;
      H.pj++; A.pj++; H.gf+=m.scoreHome; H.gc+=m.scoreAway; A.gf+=m.scoreAway; A.gc+=m.scoreHome;
      if(m.scoreHome>m.scoreAway){ H.g++; H.pts+=2; A.p++; }
      else if(m.scoreHome<m.scoreAway){ A.g++; A.pts+=2; H.p++; }
      else { H.e++; A.e++; H.pts+=1; A.pts+=1; }
    }
  });
  const arr = Object.values(map).map(s=>({...s, dg:s.gf-s.gc, team:getTeam(s.teamId)}));
  arr.sort((a,b)=> b.pts-a.pts || b.dg-a.dg || b.gf-a.gf || a.team.name.localeCompare(b.team.name));
  return arr;
}

function zoneStandings(zone){
  const teamIds = state.teams.filter(t=>t.zone===zone).map(t=>t.id);
  const matchList = state.matches.filter(m=>m.zone===zone);
  return computeStandings(matchList, teamIds);
}

function generateFasePhase(s, rng, autoSimulate){
  const topA = zoneStandingsFromState(s,'A').slice(0,3).map(x=>x.teamId);
  const topB = zoneStandingsFromState(s,'B').slice(0,3).map(x=>x.teamId);
  const finalIds = [...topA, ...topB];
  const rounds = generateRoundRobin(finalIds);
  let id = 9000;
  const matches = [];
  rounds.forEach((pairs, idx)=>{
    pairs.forEach(([home,away])=>{
      matches.push({ id:id++, zone:'F', jornada: idx+1, home, away,
        scoreHome:null, scoreAway:null, jugado:false, wo:false, woFor:null, anulado:false,
        date:null, time:null });
    });
  });
  if(autoSimulate){
    const r = rng || mulberry32(777);
    matches.forEach(m=>{ m.scoreHome=simulateScore(r); m.scoreAway=simulateScore(r); m.jugado=true; });
  }
  s.finalMatches = matches;
  s.finalTeams = finalIds;
  s.finalGenerated = true;
  saveState(s);
}

function zoneStandingsFromState(s, zone){
  const teamIds = s.teams.filter(t=>t.zone===zone).map(t=>t.id);

  const map = {};
  teamIds.forEach(id=>{ map[id]={teamId:id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}; });
  matchList.forEach(m=>{
    if(m.anulado) return;
    if(m.wo){
      const w=m.woFor, l=(m.home===w)?m.away:m.home;
      if(map[w]){map[w].pj++;map[w].g++;map[w].pts+=2;}
      if(map[l]){map[l].pj++;map[l].p++;}
      return;
    }
    if(m.jugado){
      const H=map[m.home],A=map[m.away];
      H.pj++;A.pj++;H.gf+=m.scoreHome;H.gc+=m.scoreAway;A.gf+=m.scoreAway;A.gc+=m.scoreHome;
      if(m.scoreHome>m.scoreAway){H.g++;H.pts+=2;A.p++;}
      else if(m.scoreHome<m.scoreAway){A.g++;A.pts+=2;H.p++;}
      else {H.e++;A.e++;H.pts+=1;A.pts+=1;}
    }
  });
  const arr = Object.values(map).map(x=>({...x, dg:x.gf-x.gc, teamId:x.teamId}));
  arr.sort((a,b)=> b.pts-a.pts || b.dg-a.dg || b.gf-a.gf || 0);

function retireTeam(teamId, retirado){

    const ok = confirm(`¿Confirmás retirar a "${team.name}" del torneo?\n\nLos partidos pendientes de este equipo se darán por W.O. a favor del rival (2 puntos).`);
    if(!ok) return;

  team.retirado = retirado;
  const allMatches = [...state.matches, ...state.finalMatches];
  allMatches.forEach(m=>{
    if(m.home!==teamId && m.away!==teamId) return;
    if(retirado){
      if(m.jugado) return; // ya jugado, no se toca
      const opponentId = m.home===teamId ? m.away : m.home;
      const opponent = getTeam(opponentId);
      if(opponent && opponent.retirado){ m.anulado = true; m.wo=false; m.woFor=null; }
      else { m.wo = true; m.woFor = opponentId; }
    } else {
      if(m.wo){ m.wo=false; m.woFor=null; }
      if(m.anulado){
        const opponentId = m.home===teamId ? m.away : m.home;
        const opponent = getTeam(opponentId);
        if(!opponent || !opponent.retirado){ m.anulado=false; }
      }

  });
  persistState();
  renderAll();
}

const DOW_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTH_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function formatDateLong(dateStr){
  if(!dateStr) return '';
  const [y,mo,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, mo-1, d);
  const dow = DOW_ES[dt.getDay()];
  return `${dow.charAt(0).toUpperCase()+dow.slice(1)} ${d} de ${MONTH_ES[mo-1]}`;
}

function matchesOf(zone, jornada){
  return zone==='F'
    ? state.finalMatches.filter(m=>m.jornada===jornada)
    : state.matches.filter(m=>m.zone===zone && m.jornada===jornada);
}

function commonScheduleFor(matches){
  const dates = [...new Set(matches.filter(m=>!m.anulado).map(m=>m.date).filter(Boolean))];
  const times = [...new Set(matches.filter(m=>!m.anulado).map(m=>m.time).filter(Boolean))];
  return { date: dates.length===1 ? dates[0] : '', time: times.length===1 ? times[0] : '' };
}

function setMatchSchedule(matchId, field, value){
  const all = [...state.matches, ...state.finalMatches];
  const m = all.find(x=>x.id===matchId);
  if(!m) return;
  if(field === 'date' && value && !esSabado(value)){
    alert('Este torneo se juega los sábados. Elegí un sábado.');
    renderAll(); return;
  }
  if(field === 'time' && value){
    if(!timeInRange(value)){
      alert(`El horario tiene que estar entre ${HORA_INICIO} y ${HORA_FIN}.`);
      renderAll(); return;
    }
    const clash = all.find(x=>x.id!==m.id && x.jornada===m.jornada && x.zone===m.zone && !x.anulado && x.time===value);
    if(clash){
      alert(`Las ${value}hs ya están ocupadas en la Fecha ${m.jornada} por ${getTeam(clash.home).name} vs ${getTeam(clash.away).name}.`);
      renderAll(); return;
    }
  }
  m[field] = value || null;
  persistState();
  renderAll();
}

function seedForBracket(){

  const combined = [...a, ...b];
  combined.sort((x,y)=> y.pts-x.pts || y.dg-x.dg || y.gf-x.gf || x.team.name.localeCompare(y.team.name));
  return combined.map(r=>r.teamId);

function buildBracket(){

      r1a:   { id:'r1a',   round:'Cuartos',     teamA:seeds[2], teamB:seeds[5], scoreA:null, scoreB:null, penalWinner:null },
      r1b:   { id:'r1b',   round:'Cuartos',     teamA:seeds[3], teamB:seeds[4], scoreA:null, scoreB:null, penalWinner:null },
      sf1:   { id:'sf1',   round:'Semifinal',   teamA:seeds[0], teamB:null,     scoreA:null, scoreB:null, penalWinner:null, from:'r1b' },
      sf2:   { id:'sf2',   round:'Semifinal',   teamA:seeds[1], teamB:null,     scoreA:null, scoreB:null, penalWinner:null, from:'r1a' },
      final: { id:'final', round:'Final',       teamA:null,     teamB:null,     scoreA:null, scoreB:null, penalWinner:null, fromA:'sf2', fromB:'sf1' },
      third: { id:'third', round:'3er puesto',  teamA:null,     teamB:null,     scoreA:null, scoreB:null, penalWinner:null, fromA:'sf2', fromB:'sf1', useLoser:true }
    }
  };
  propagateBracket();
}

function getMatchResult(m){
  if(!m) return null;
  if(m.penalWinner) return m.penalWinner;
  if(m.scoreA!==null && m.scoreB!==null && m.scoreA!==m.scoreB){
    return m.scoreA > m.scoreB ? m.teamA : m.teamB;
  }
  return null;
}
function getMatchLoser(m){
  const w = getMatchResult(m);
  if(!w || !m.teamA || !m.teamB) return null;
  return w===m.teamA ? m.teamB : m.teamA;
}

function propagateBracket(){
  const M = state.bracket.matches;
  M.sf1.teamB = getMatchResult(M.r1b);
  M.sf2.teamB = getMatchResult(M.r1a);
  M.final.teamA = getMatchResult(M.sf2);
  M.final.teamB = getMatchResult(M.sf1);
  M.third.teamA = getMatchLoser(M.sf2);
  M.third.teamB = getMatchLoser(M.sf1);
}

function clearBracketMatch(m){ m.scoreA=null; m.scoreB=null; m.penalWinner=null; }

function setBracketScore(matchId, side, value){
  const M = state.bracket.matches;
  const m = M[matchId];
  const v = value === "" ? null : Math.max(0, Math.min(99, parseInt(value,10)||0));
  if(side==='A') m.scoreA = v; else m.scoreB = v;
  m.penalWinner = null;
  (BRACKET_DOWNSTREAM[matchId]||[]).forEach(id=>clearBracketMatch(M[id]));
  propagateBracket();
  persistState();
  renderAll();
}

function setBracketPenalWinner(matchId, teamId){
  const M = state.bracket.matches;
  const m = M[matchId];
  m.penalWinner = teamId ? Number(teamId) : null;
  (BRACKET_DOWNSTREAM[matchId]||[]).forEach(id=>clearBracketMatch(M[id]));
  propagateBracket();
  persistState();
  renderAll();
}

function switchFinalFormat(fmt){
  if(fmt === state.finalFormat) return;
  const ok = confirm('Cambiar el formato de la Fase Final borra los resultados actuales de esa fase. ¿Continuar?');
  if(!ok) return;
  state.finalFormat = fmt;
  if(fmt === 'eliminacion'){
    buildBracket();
  } else {
    state.finalGenerated = false; state.finalMatches = []; state.finalTeams = [];
    generateFasePhase(state, null, false);
  }
  persistState();
  renderAll();
}

function createFasePhase(){
  generateFasePhase(state);
  persistState();
  renderAll();
}

function rebuildBracketConfirm(){
  const ok = confirm('Esto reconstruye la llave tomando los 3 primeros actuales de cada zona y borra los resultados ya jugados de la llave. ¿Continuar?');
  if(!ok) return;
  buildBracket();
  persistState();
  renderAll();
}

function buildFullScheduleText(jornada){
  const msA = state.matches.filter(m=>m.zone==='A'&&m.jornada===jornada);
  const msB = state.matches.filter(m=>m.zone==='B'&&m.jornada===jornada);
  const all = [...msA,...msB].filter(m=>!m.anulado);
  all.sort((a,b)=>{
    if(!a.time&&!b.time) return 0;
    if(!a.time) return 1; if(!b.time) return -1;
    return a.time.localeCompare(b.time);
  });

  const lines = [];
  lines.push(`⚽ *${TORNEO_NOMBRE.toUpperCase()} — FECHA ${jornada}*`);
  lines.push('📋 Ordenado por horario');
  lines.push('');

  all.forEach(m=>{
    const home = getTeam(m.home).name, away = getTeam(m.away).name;
    const zona = '';
    const hora = m.time ? `🕐 *${m.time.slice(0,5)}hs*` : '🕐 a confirmar';
    if(m.wo){
      lines.push(`${hora}  ${home} vs ${away} → W.O. → ${getTeam(m.woFor).name} ${zona}`);
    } else if(m.adminResult){
      lines.push(`${hora}  ${home} vs ${away} → ⚖️ Puntos ganados: *${getTeam(m.adminResult.teamId).name}* ${zona}`);
    } else if(m.jugado){
      lines.push(`${hora}  ${home} *${m.scoreHome}-${m.scoreAway}* ${away} ${zona}`);
    } else {
      lines.push(`${hora}  ${home} vs ${away} ${zona}`);
    }
  });

  const byeA = getByeTeam('A', jornada);
  const byeB = getByeTeam('B', jornada);
  const byes = [byeA, byeB].filter(Boolean);
  if(byes.length){
    lines.push('');
    lines.push(`🔘 *Descansan: ${byes.map(t=>t.name).join(' · ')}*`);
  }
  lines.push('');
  lines.push('_Cualquier cambio de horario se avisa por este mismo medio._');
  return lines.join('\n');
}

function exportFullScheduleWhatsApp(jornada){

function buildWhatsAppText(zone, jornada){
  const matches = matchesOf(zone, jornada).filter(m=>!m.anulado);
  const sorted = matches.slice().sort((a,b)=>{
    const ak = (a.date||'9999-99-99')+' '+(a.time||'99:99');
    const bk = (b.date||'9999-99-99')+' '+(b.time||'99:99');
    return ak.localeCompare(bk);
  });
  const zoneLabel = zone==='F' ? 'FASE FINAL' : `ZONA ${zone}`;
  const lines = [];
  lines.push(`⚽ *${TORNEO_NOMBRE.toUpperCase()}${zone==='F' ? ' — FASE FINAL' : ''}*`);
  lines.push(`📅 *Fecha ${jornada}*`);
  lines.push('');
  let lastGroup = null;
  sorted.forEach(m=>{
    const groupKey = m.date || 'sin-fecha';
    if(groupKey !== lastGroup){
      lines.push(m.date ? `🗓️ ${formatDateLong(m.date)}` : '🗓️ Sin horario asignado');
      lastGroup = groupKey;
    }
    const home = getTeam(m.home).name, away = getTeam(m.away).name;
    if(m.wo){
      lines.push(`   ${home} vs ${away} → W.O. a favor de ${getTeam(m.woFor).name}`);
    } else if(m.adminResult){
      lines.push(`   ${home} vs ${away} → ⚖️ Puntos ganados: ${getTeam(m.adminResult.teamId).name}`);
    } else {
      const hora = m.time ? `🕐 ${m.time} hs` : '🕐 a confirmar';
      lines.push(`   ${hora}   ${home} vs ${away}`);
    }
  });
  lines.push('');
  const bye = getByeTeam(zone, jornada);
  if(bye) lines.push(`🔘 *Descansa esta fecha: ${bye.name}*`);
  lines.push('_Cualquier cambio de horario se avisa por este mismo medio._');
  return lines.join('\n');
}

function exportWhatsApp(zone, jornada){
  const text = buildWhatsAppText(zone, jornada);
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function copyJornadaText(zone, jornada, btn){

    setTimeout(()=>{ btn.textContent = original; }, 1500);

function todayLabel(){
  const d = new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}

function drawLogoOnCanvas(ctx, cx, cy, r){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
  const LI = (LOGO_CIRCLE_IMG && LOGO_CIRCLE_IMG.complete && LOGO_CIRCLE_IMG.naturalWidth > 0) ? LOGO_CIRCLE_IMG : LOGO_IMG;
  if(LI && LI.complete && LI.naturalWidth > 0){
    const iw = LI.naturalWidth, ih = LI.naturalHeight;
    const scale = (r*2) / Math.min(iw, ih);
    const dw = iw*scale, dh = ih*scale;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx-r, cy-r, r*2, r*2);
    ctx.drawImage(LI, cx-dw/2, cy-dh/2, dw, dh);
  } else {
    ctx.fillStyle = '#00336f'; ctx.fillRect(cx-r, cy-r, r*2, r*2);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(251,192,2,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawJornadaCanvas(zone, jornada, matches){
  const margin = 28, rowH = 88, footH = 38;
  const width = 620;
  const scale = 2;

  const bannerH = (LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0)
    ? Math.round(width * LOGO_IMG.naturalHeight / LOGO_IMG.naturalWidth) : 0;
  const headH = bannerH + 68;
  const height = headH + matches.length * rowH + footH;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale; canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Background
  ctx.fillStyle = '#00336f'; ctx.fillRect(0,0,width,height);

  // Banner
  if(LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0){
    ctx.drawImage(LOGO_IMG, 0, 0, width, bannerH);
    const fade = ctx.createLinearGradient(0, bannerH-40, 0, bannerH);
    fade.addColorStop(0,'rgba(0,51,111,0)'); fade.addColorStop(1,'rgba(0,51,111,1)');
    ctx.fillStyle = fade; ctx.fillRect(0, bannerH-40, width, 40);
  }

  // Header
  const hy = bannerH + 26;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbc002';
  ctx.font = '900 20px Barlow Condensed, sans-serif';
  const zoneLabel = zone==='F' ? 'FASE FINAL  ·  ' : '';
  ctx.fillText(`${zoneLabel}FECHA ${jornada}`, width/2, hy);

  // BYE team sub-header
  const byeT = getByeTeam(zone, jornada);
  if(byeT){
    ctx.font = '500 11px IBM Plex Mono, monospace';
    ctx.fillStyle = 'rgba(251,192,2,.4)';
    ctx.fillText(`🔘 Descansa: ${byeT.name}`, width/2, hy + 18);
  }

  ctx.strokeStyle = 'rgba(251,192,2,.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(margin, headH-10); ctx.lineTo(width-margin, headH-10); ctx.stroke();

  // Match rows
  matches.forEach((m, i)=>{
    const y = headH + i * rowH;
    const cx = width / 2;
    if(i % 2 === 0){ ctx.fillStyle = 'rgba(255,255,255,.02)'; ctx.fillRect(0, y, width, rowH); }

    const homeT = getTeam(m.home), awayT = getTeam(m.away);

    // DATE + TIME — centered top
    const dateY = y + 22;
    if(!m.wo && !m.anulado){
      const dateStr = m.date ? formatDateLong(m.date) : 'Fecha a confirmar';
      const timeStr = m.time ? m.time.slice(0,5) + 'hs' : '';

      // measure total width of both pills to center them
      ctx.font = '600 13px Oswald, sans-serif';
      const dateW = ctx.measureText(dateStr).width + 22;
      ctx.font = '900 15px Barlow Condensed, sans-serif';
      const timeW = timeStr ? ctx.measureText(timeStr).width + 22 : 0;
      const gap = timeStr ? 8 : 0;
      const totalW = dateW + gap + timeW;
      let pillX = cx - totalW/2;

      // Date pill — white
      ctx.font = '600 13px Oswald, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(pillX, dateY-15, dateW, 20);
      ctx.fillStyle = '#00336f';
      ctx.textAlign = 'left';
      ctx.fillText(dateStr, pillX + 11, dateY);

      // Time pill — volt
      if(timeStr){
        const tpX = pillX + dateW + gap;
        ctx.font = '900 15px Barlow Condensed, sans-serif';
        ctx.fillStyle = 'rgba(251,192,2,.1)';
        ctx.fillRect(tpX, dateY-15, timeW, 20);
        ctx.strokeStyle = 'rgba(251,192,2,.45)'; ctx.lineWidth = 1;
        ctx.strokeRect(tpX, dateY-15, timeW, 20);
        ctx.fillStyle = '#fbc002';
        ctx.fillText(timeStr, tpX + 11, dateY);
      }
    }

    // TEAMS + SCORE — centered bottom
    const teamsY = y + 65;
    ctx.font = '600 14px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = homeT.retirado ? 'rgba(255,255,255,.3)' : '#ffffff';
    ctx.fillText(homeT.name, margin, teamsY);
    ctx.textAlign = 'right';
    ctx.fillStyle = awayT.retirado ? 'rgba(255,255,255,.3)' : '#ffffff';
    ctx.fillText(awayT.name, width-margin, teamsY);

    ctx.textAlign = 'center';
    if(m.anulado){
      ctx.font = '600 10px IBM Plex Mono, monospace'; ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.fillText('ANULADO', cx, teamsY);
    } else if(m.wo){
      ctx.font = '700 13px Barlow Condensed, sans-serif'; ctx.fillStyle = '#ff4d6a';
      ctx.fillText('W.O.', cx, teamsY);
    } else if(m.adminResult){
      ctx.font = '700 15px Barlow Condensed, sans-serif'; ctx.fillStyle = '#fbc002';
      ctx.fillText('PTS', cx, teamsY);
      ctx.font = '700 12px Barlow Condensed, sans-serif';
      ctx.fillText(('Puntos ganados: ' + getTeam(m.adminResult.teamId).name).toUpperCase(), cx, teamsY + 18);
    } else if(m.jugado){
      ctx.font = '900 34px Barlow Condensed, sans-serif'; ctx.fillStyle = '#fbc002';
      ctx.fillText(`${m.scoreHome}  –  ${m.scoreAway}`, cx, teamsY);
    } else {
      ctx.font = '700 15px Barlow Condensed, sans-serif'; ctx.fillStyle = 'rgba(79,174,232,.75)';
      ctx.fillText('VS', cx, teamsY);
    }

    // divider
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(margin, y+rowH-1); ctx.lineTo(width-margin, y+rowH-1); ctx.stroke();
  });

  // Footer
  ctx.strokeStyle = 'rgba(251,192,2,.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(margin, height-footH+8); ctx.lineTo(width-margin, height-footH+8); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '500 10px IBM Plex Mono, monospace';
  ctx.fillStyle = 'rgba(251,192,2,.22)';
  ctx.fillText(TORNEO_NOMBRE.toUpperCase()+' · FIXTURE Y POSICIONES', width/2, height-footH+26);

  return canvas;
}

function drawStandingsCanvas(rows, opts){
  const margin = 26, rowH = 40, tableHeadH = 32, footH = 38;
  let cursorX = margin;
  const colsX = STANDINGS_COLS.map(c=>{ const x = cursorX; cursorX += c.width; return {...c, x}; });
  const tableWidth = cursorX - margin;
  const width = tableWidth + margin*2;
  const scale = 2;

  const bannerH = (LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0)
    ? Math.round(width * LOGO_IMG.naturalHeight / LOGO_IMG.naturalWidth) : 0;
  const headH = bannerH + 78;
  const height = headH + tableHeadH + rows.length*rowH + footH;

  const canvas = document.createElement('canvas');
  canvas.width = width*scale; canvas.height = height*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Light background
  ctx.fillStyle = '#eaf4fc'; ctx.fillRect(0,0,width,height);

  // Banner
  if(LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0){
    ctx.drawImage(LOGO_IMG, 0, 0, width, bannerH);
    const fade = ctx.createLinearGradient(0, bannerH-30, 0, bannerH);
    fade.addColorStop(0,'rgba(234,244,252,0)'); fade.addColorStop(1,'rgba(234,244,252,1)');
    ctx.fillStyle = fade; ctx.fillRect(0, bannerH-30, width, 30);
  }

  // Header text
  const hy = bannerH + 28;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#00489c';
  ctx.font = '700 20px Oswald, sans-serif';
  ctx.fillText(opts.subtitle, margin, hy);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '400 10px IBM Plex Mono, monospace';
  ctx.fillText('Actualizado ' + opts.fecha, margin, hy + 18);
  ctx.strokeStyle = 'rgba(0,72,156,.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(margin, headH-8); ctx.lineTo(width-margin, headH-8); ctx.stroke();

  // Table header
  const ty = headH + 20;
  ctx.font = '600 10px Oswald, sans-serif';
  ctx.fillStyle = '#94a3b8';
  colsX.forEach(c=>{
    ctx.textAlign = c.align;
    ctx.fillText(c.label, c.align==='left' ? c.x : c.x + c.width/2, ty);
  });
  ctx.strokeStyle = 'rgba(10,42,85,.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(margin, headH+tableHeadH-4); ctx.lineTo(width-margin, headH+tableHeadH-4); ctx.stroke();

  // Table rows
  rows.forEach((r,i)=>{
    const y = headH + tableHeadH + i*rowH;
    const isQual = opts.qualCount && i < opts.qualCount;
    const isChamp = opts.champion && i === 0;

    // Row bg — white card
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(10,42,85,.06)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
    ctx.fillRect(margin-4, y+2, tableWidth+8, rowH-4);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    // Qual accent bar
    if(isQual){
      ctx.fillStyle = '#2b8fd0';
      ctx.fillRect(margin-4, y+2, 3, rowH-4);
    }
    if(isChamp){
      ctx.fillStyle = 'rgba(251,192,2,.08)';
      ctx.fillRect(margin-4, y+2, tableWidth+8, rowH-4);
    }

    const textY = y + rowH/2 + 5;
    colsX.forEach(c=>{
      ctx.textAlign = c.align;
      const drawX = c.align==='left' ? c.x + (isQual?8:0) : c.x + c.width/2;
      if(c.key==='pos'){
        ctx.font='500 11px IBM Plex Mono, monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(String(i+1), drawX, textY);
      } else if(c.key==='team'){
        ctx.font = isChamp ? '700 14px Inter, sans-serif' : '500 14px Inter, sans-serif';
        ctx.fillStyle = isChamp ? '#c48f00' : '#0a2a55';
        const label = (isChamp?'🏆 ':'') + r.team.name + (r.team.retirado?'  (RET)':'');
        ctx.fillText(label, drawX, textY);
      } else if(c.key==='pts'){
        ctx.font='700 15px Barlow Condensed, sans-serif';
        ctx.fillStyle = '#00489c';
        ctx.fillText(String(r.pts), drawX, textY);
      } else {
        ctx.font='400 12px IBM Plex Mono, monospace';
        ctx.fillStyle = '#3d5a80';
        let val = r[c.key]; if(c.key==='dg') val = (val>0?'+':'')+val;
        ctx.fillText(String(val), drawX, textY);
      }
    });
  });

  // Footer
  ctx.strokeStyle = 'rgba(0,72,156,.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(margin, height-footH+8); ctx.lineTo(width-margin, height-footH+8); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = '400 10px IBM Plex Mono, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(TORNEO_NOMBRE+' · fixture y posiciones', margin, height-footH+26);

  return canvas;
}

function showImageModal(canvas, filename){
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const modal = document.createElement('div');
    modal.className = 'imgmodal';
    modal.innerHTML = `
      <div class="imgmodal-card">
        <img src="${url}" alt="Tabla de posiciones">
        <div class="imgmodal-actions">
          <button class="action" id="imgShareBtn">📲 Compartir / Guardar</button>
          <button class="action ghost" id="imgCloseBtn">Cerrar</button>
        </div>
        <p class="imgmodal-hint">En el celular podés mantener presionada la imagen para guardarla o compartirla directo por WhatsApp.</p>
      </div>
    `;
    document.body.appendChild(modal);
    const cleanup = ()=>{ modal.remove(); URL.revokeObjectURL(url); };
    modal.addEventListener('click', e=>{ if(e.target===modal) cleanup(); });
    document.getElementById('imgCloseBtn').onclick = cleanup;
    document.getElementById('imgShareBtn').onclick = async ()=>{
      try{
        const file = new File([blob], filename, {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:TORNEO_NOMBRE});
          return;
        }
      }catch(e){ /* fall back to download below */ }
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
    };
  }, 'image/png');
}

function exportReadOnlyVersion(){
  const ok = confirm("Esto descarga una copia de este archivo en modo solo lectura, con los datos de ahora mismo, para mandar a otras personas. Vos seguís editando desde este archivo. ¿Generar la copia?");
  if(!ok) return;
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const snapshot = JSON.stringify(state);
  const out = html
    .replace('let VIEW_ONLY = false;', 'let VIEW_ONLY = true;')
    .replace('let EMBEDDED_STATE = null;', 'let EMBEDDED_STATE = ' + snapshot + ';');
  const blob = new Blob([out], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${TORNEO_SLUG}-solo-lectura-${todayLabel().replace(/\//g,'-')}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function getByeTeam(zone, jornada){
  const zoneTeams = state.teams.filter(t=>t.zone===zone);
  const playingIds = new Set();
  state.matches.filter(m=>m.zone===zone&&m.jornada===jornada).forEach(m=>{
    playingIds.add(m.home); playingIds.add(m.away);
  });
  return zoneTeams.find(t=>!playingIds.has(t.id)) || null;
}

function swapFechas(zone, jornada){
  const maxJ = Math.max(...state.matches.filter(m=>m.zone===zone).map(m=>m.jornada));
  const options = Array.from({length:maxJ},(_,i)=>i+1).filter(j=>j!==jornada);
  const input = prompt(
    `ZONA ${zone} · FECHA ${jornada}\n\n¿Con qué fecha querés intercambiarla?\nEscribí el número (1 al ${maxJ}, excepto ${jornada}):`,
    ''
  );
  if(input===null) return;
  const target = parseInt(input);
  if(isNaN(target)||target<1||target>maxJ||target===jornada){
    alert(`Número inválido. Ingresá un número entre 1 y ${maxJ} distinto de ${jornada}.`);
    return;
  }
  // Swap jornada numbers between the two sets of matches
  state.matches.filter(m=>m.zone===zone).forEach(m=>{
    if(m.jornada===jornada) m.jornada = target;
    else if(m.jornada===target) m.jornada = jornada;
  });
  persistState(); renderAll();
}

function drawFullScheduleCanvas(jornada){
  const msA = state.matches.filter(m=>m.zone==='A'&&m.jornada===jornada);
  const msB = state.matches.filter(m=>m.zone==='B'&&m.jornada===jornada);
  const allMatches = [...msA,...msB].filter(m=>!m.anulado);

  allMatches.sort((a,b)=>{
    if(!a.time&&!b.time) return 0;
    if(!a.time) return 1; if(!b.time) return -1;
    return a.time.localeCompare(b.time);
  });

  const byeA = getByeTeam('A', jornada);
  const byeB = getByeTeam('B', jornada);
  const byes = [byeA, byeB].filter(Boolean);

  const margin = 30, rowH = 110, footH = 50, width = 640, scale = 2;
  const bannerH = (LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0)
    ? Math.round(width * LOGO_IMG.naturalHeight / LOGO_IMG.naturalWidth) : 0;
  const headH = bannerH + 80;
  const byeH = byes.length ? 90 : 0;
  const height = headH + allMatches.length * rowH + byeH + footH;

  const canvas = document.createElement('canvas');
  canvas.width = width*scale; canvas.height = height*scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);

  // Background — light
  ctx.fillStyle = '#eaf4fc'; ctx.fillRect(0,0,width,height);

  // Banner
  if(LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth > 0){
    ctx.drawImage(LOGO_IMG, 0, 0, width, bannerH);
    const fade = ctx.createLinearGradient(0,bannerH-30,0,bannerH);
    fade.addColorStop(0,'rgba(234,244,252,0)'); fade.addColorStop(1,'rgba(234,244,252,1)');
    ctx.fillStyle = fade; ctx.fillRect(0,bannerH-30,width,30);
  }

  // Header text
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00489c';
  ctx.font = '900 26px Barlow Condensed, sans-serif';
  ctx.fillText(`FECHA ${jornada} — PROGRAMA COMPLETO`, width/2, bannerH+32);
  ctx.fillStyle = '#5b7699';
  ctx.font = '500 12px IBM Plex Mono, monospace';
  ctx.fillText(TORNEO_NOMBRE.toUpperCase()+' · ordenado por horario', width/2, bannerH+52);
  ctx.strokeStyle = 'rgba(0,72,156,.2)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(margin,headH-12); ctx.lineTo(width-margin,headH-12); ctx.stroke();

  // Match rows
  allMatches.forEach((m,i)=>{
    const y = headH + i*rowH;
    const cx = width/2;

    // Row background — white card
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(10,42,85,.08)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    roundRect(ctx, margin-8, y+4, width-margin*2+16, rowH-10, 8);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    const homeT = getTeam(m.home), awayT = getTeam(m.away);

    // Zone badge
    ctx.font = '700 10px IBM Plex Mono, monospace';
    ctx.fillStyle = m.zone==='A' ? '#2b8fd0' : '#00489c';
    ctx.textAlign = 'left';
    

    // Time — big, blue
    const timeStr = m.time ? m.time.slice(0,5)+'hs' : 'Horario a confirmar';
    ctx.font = '900 34px Barlow Condensed, sans-serif';
    ctx.fillStyle = m.time ? '#00489c' : '#94a3b8';
    ctx.textAlign = 'center';
    ctx.fillText(timeStr, cx, y+32);

    // Teams — dark, large
    ctx.font = '600 19px Inter, sans-serif';
    ctx.fillStyle = '#0a2a55';
    ctx.textAlign = 'left';
    ctx.fillText(homeT.name, margin, y+68);
    ctx.textAlign = 'right';
    ctx.fillText(awayT.name, width-margin, y+68);

    // Score or VS
    ctx.textAlign = 'center';
    if(m.adminResult){
      ctx.font = '700 18px Barlow Condensed, sans-serif';
      ctx.fillStyle = '#c48f00';
      ctx.fillText('PTS', cx, y+72);
      ctx.font = '800 14px Barlow Condensed, sans-serif';
      ctx.fillText(('Puntos ganados: ' + getTeam(m.adminResult.teamId).name).toUpperCase(), cx, y+96);
    } else if(m.jugado){
      ctx.font = '900 38px Barlow Condensed, sans-serif';
      ctx.fillStyle = '#00489c';
      ctx.fillText(`${m.scoreHome}  –  ${m.scoreAway}`, cx, y+72);
    } else if(m.wo){
      ctx.font = '700 15px Barlow Condensed, sans-serif';
      ctx.fillStyle = '#dc2626';
      ctx.fillText('W.O.', cx, y+72);
    } else {
      ctx.font = '700 18px Barlow Condensed, sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('VS', cx, y+72);
    }
  });

  // BYE section
  if(byes.length){
    const byeY = headH + allMatches.length*rowH + 14;
    ctx.fillStyle = 'rgba(0,72,156,.06)';
    roundRect(ctx, margin-8, byeY, width-margin*2+16, byeH-14, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,72,156,.2)'; ctx.lineWidth=1;
    ctx.stroke();

    ctx.textAlign='center';
    ctx.font='700 12px IBM Plex Mono, monospace';
    ctx.fillStyle='#5b7699';
    ctx.fillText('🔘 DESCANSA ESTA FECHA', width/2, byeY+26);
    ctx.font='900 22px Barlow Condensed, sans-serif';
    ctx.fillStyle='#00489c';
    ctx.fillText(byes.map(t=>t.name).join('   ·   '), width/2, byeY+54);
  }

  // Footer
  ctx.strokeStyle='rgba(0,72,156,.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(margin,height-footH+10); ctx.lineTo(width-margin,height-footH+10); ctx.stroke();
  ctx.textAlign='center';
  ctx.font='500 10px IBM Plex Mono, monospace';
  ctx.fillStyle='#94a3b8';
  ctx.fillText(TORNEO_NOMBRE.toUpperCase()+' · FIXTURE Y POSICIONES', width/2, height-footH+30);

  return canvas;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function exportBackup(){
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup-${TORNEO_SLUG}-${ts}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const ok = confirm(`¿Restaurar el backup "${file.name}"? Esto va a reemplazar TODOS los datos actuales del torneo. No se puede deshacer.`);
  if(!ok){ input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const restored = JSON.parse(e.target.result);
      if(!restored.teams || !restored.matches) throw new Error('Archivo inválido');
      if(usingLive && docRef){
        docRef.set(restored).then(()=>{
          alert('✅ Backup restaurado correctamente.');
        }).catch(err=>alert('Error al restaurar: ' + (err&&err.message?err.message:err)));
      } else {
        state = normalizeState(restored);
        saveState(state);
        renderAll();
        alert('✅ Backup restaurado correctamente.');
      }
    }catch(err){
      alert('Error al leer el archivo: ' + (err&&err.message?err.message:err));
    }
    input.value='';
  };
  reader.readAsText(file);
}

let sancionZona = 'todas';

function addSancion(){
  const teamId = parseInt(document.getElementById('sanTeam').value);
  const player = document.getElementById('sanPlayer').value.trim();
  const card = document.getElementById('sanCard').value;
  const fecha = parseInt(document.getElementById('sanFecha').value);
  const susp = parseInt(document.getElementById('sanSusp').value)||0;
  const nota = document.getElementById('sanNota').value.trim();
  if(!teamId||!player||!card||!fecha){ alert('Completá equipo, jugador, tarjeta y fecha.'); return; }
  const newId = (state.sanciones.length ? Math.max(...state.sanciones.map(s=>s.id))+1 : 1);
  state.sanciones.push({ id:newId, teamId, player, card, fecha, susp, nota });
  persistState(); renderAll();
}

function deleteSancion(id){
  if(!confirm('¿Eliminar esta sanción?')) return;
  state.sanciones = state.sanciones.filter(s=>s.id!==id);
  persistState(); renderAll();
}

function editSancionFecha(id){
  const s = state.sanciones.find(x=>x.id===id);
  if(!s) return;
  const val = prompt(`Cambiar número de fecha para "${s.player}" (actual: Fecha ${s.fecha}):`, s.fecha);
  if(val===null) return;
  const n = parseInt(val);
  if(isNaN(n)||n<1){ alert('Número de fecha inválido.'); return; }
  s.fecha = n;
  persistState(); renderAll();
}

function editSancionSusp(id){
  const s = state.sanciones.find(x=>x.id===id);
  if(!s) return;
  const val = prompt(`Fechas de suspensión para "${s.player}" (actual: ${s.susp}):`, s.susp);
  if(val===null) return;
  const n = parseInt(val);
  if(isNaN(n)||n<0){ alert('Número inválido.'); return; }
  s.susp = n;
  persistState(); renderAll();
}

function showLoginOverlay(){
  const existing = document.getElementById('loginOverlay');

  overlay.id = 'loginOverlay';
  overlay.innerHTML = `
    <div class="login-overlay">

        <button id="ovBtn" class="action" onclick="doOverlayLogin()">Entrar</button>
        <p class="loginerr" id="ovErr"></p>
        <button class="action ghost" style="margin-top:4px;" onclick="document.getElementById('loginOverlay').remove()">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

function doOverlayLogin(){
  const email = (document.getElementById('ovEmail')||{}).value || '';
  const pass = (document.getElementById('ovPass')||{}).value || '';
  const errEl = document.getElementById('ovErr');
  const btnEl = document.getElementById('ovBtn');
  if(!email.trim() || !pass){ if(errEl) errEl.textContent = 'Completá email y contraseña.'; return; }
  if(errEl) errEl.textContent = '';
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Ingresando…'; }
  auth.signInWithEmailAndPassword(email.trim(), pass)
    .then(()=>{ const ov=document.getElementById('loginOverlay'); if(ov) ov.remove(); })
    .catch(err=>{
      if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'Entrar'; }
      const msg = err && err.code === 'auth/wrong-password' ? 'Contraseña incorrecta.'
        : err && err.code === 'auth/user-not-found' ? 'Email no encontrado.'
        : err && err.code === 'auth/network-request-failed' ? 'Sin conexión.'
        : 'Error: ' + (err && err.message ? err.message : '');
      if(errEl) errEl.textContent = msg;
    });
}

function renderHeaderMeta(){
  let subtitle = '10 equipos · sábados';
  if(usingLive){
    const badge = liveStatus !== 'online'
      ? '<span class="lockbadge">🟡 Conectando…</span>'
      : isEditor
        ? '<span class="lockbadge live">✏️ Editor</span>'
        : '<span class="lockbadge live">🟢 En vivo</span>';
    subtitle += ' ' + badge;
  } else {
    subtitle += VIEW_ONLY ? ' <span class="lockbadge">🔒 Solo lectura</span>' : '';
  }
  document.getElementById('subtitle').innerHTML = subtitle;

  let footer;
  if(usingLive){
    footer = isEditor
      ? 'Estás editando en vivo: cualquier cambio que hagas se ve al instante en todas las copias de este archivo que estén abiertas. Pestaña "Compartir" para cerrar tu sesión de editor.'
      : 'Estás viendo el torneo en vivo. Los resultados y horarios los actualiza quien organiza — esta vista se refresca sola, no hace falta recargar nada. Pestaña "Compartir" para iniciar sesión si sos el organizador.';
  } else {
    footer = VIEW_ONLY
      ? 'Estás viendo una copia de solo lectura, con los datos al momento en que se generó. No vas a poder cambiar resultados, horarios ni retiros desde aquí — para eso pedile el archivo original a quien organiza el torneo.'
      : 'Datos de ejemplo con equipos ficticios, guardados en este navegador (localStorage). Edita cualquier marcador tocando los casilleros del fixture — las tablas se recalculan solas. Botón "Reiniciar demo" en Equipos para volver al estado inicial, y pestaña "Compartir" para mandar una copia de solo lectura.';
  }
  document.getElementById('footerNote').innerHTML = footer;
}

function renderAll(){
  const bt = document.getElementById('bannerTitle');
  if(bt && !LOGO_B64) bt.textContent = TORNEO_NOMBRE;
  if(!state){
    document.getElementById('subtitle').innerHTML = '10 equipos · sábados <span class="lockbadge">🟡 Conectando…</span>';
    document.getElementById('headstats').innerHTML = '';
    document.getElementById('footerNote').innerHTML = '';
    document.getElementById('content').innerHTML = '<div class="card empty"><p>Conectando con el torneo en vivo…</p></div>';
    return;
  }
  renderHeaderMeta();
  renderRail();
  renderHeadstats();
  if(loginPending) return; // no borrar el formulario mientras está ingresando
  const content = document.getElementById('content');
  if(activeTab==='fixture') content.innerHTML = renderFixture();
  else if(activeTab==='posiciones') content.innerHTML = renderPosiciones();
  else if(activeTab==='equipos') content.innerHTML = renderEquipos();
  else if(activeTab==='final') content.innerHTML = renderFinal();
  else if(activeTab==='sanciones') content.innerHTML = renderSanciones();
  else if(activeTab==='reglamento') content.innerHTML = renderReglamento();
  else if(activeTab==='compartir') content.innerHTML = renderCompartir();

  content.querySelectorAll('.zonebtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeZone = btn.dataset.zone; renderAll(); });
  });
}

startApp();
</script>
</body>
</html>
